# .NET building-blocks monorepo: one pkg:<name> label per project under src/
# (eight publishable building blocks), plus area/category labels. Mirrors the
# resq-software/npm labeler format (label -> changed-files -> any-glob-to-any-file).

# ── Package scope labels (one per building-block project under src/) ─────

"pkg:domain":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Domain/**/*

"pkg:application":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Application/**/*

"pkg:adapters-web":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Adapters.Web/**/*

"pkg:adapters-persistence":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Adapters.Persistence/**/*

"pkg:adapters-messaging":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Adapters.Messaging/**/*

"pkg:service-defaults":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.ServiceDefaults/**/*

"pkg:testing":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Testing/**/*

"pkg:testing-integration":
  - changed-files:
    - any-glob-to-any-file: src/ResQ.BuildingBlocks.Testing.Integration/**/*

# ── Area labels ─────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/workflows/**/*
      - .github/actions/**/*
      - .githooks/**/*
      - .devcontainer/**/*

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - Directory.Build.props
      - Directory.Packages.props
      - "**/Directory.Build.props"
      - global.json
      - NuGet.config
      - "*.slnx"

"A-Templates":
  - changed-files:
    - any-glob-to-any-file: templates/**/*

"A-Samples":
  - changed-files:
    - any-glob-to-any-file: samples/**/*

# ── Category labels ──────────────────────────────────────

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*

"C-Testing":
  - changed-files:
    - any-glob-to-any-file:
      - src/ResQ.BuildingBlocks.Testing/**/*
      - src/ResQ.BuildingBlocks.Testing.Integration/**/*
      - "**/*.Tests.csproj"
      - "**/*Tests.cs"

"C-Chore":
  - changed-files:
    - any-glob-to-any-file:
      - .config/**/*
      - .editorconfig
      - .gitattributes
      - .gitignore
