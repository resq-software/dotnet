#
# Thin CI wrapper (mirrors resq-software/dotnet-sdk). The `gates` job
# dispatches to the org-wide reusable `required` aggregator in
# resq-software/.github (dotnet-ci: restore/build/format/test, plus the
# security scan + repo-standards). The top-level `required`
# job emits the status-check context consumed by the org ruleset
# `default-branch-baseline`, and additionally gates this repo's
# NuGet pack and dotnet-new template smoke.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual release path. Preferred publishing is a v* tag (MinVer derives the version);
  # this dispatch exists as a fallback for when tag creation is restricted by governance —
  # it packs the explicit version and publishes through the same OIDC trusted-publishing policy.
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Version to pack & publish to NuGet (e.g. 0.2.0)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Job-scoped permissions: the reusable's zizmor job needs
    # security-events:write to upload its SARIF; PR metadata read is needed
    # by some scanners. Keeping the workflow-level grant at contents:read
    # avoids blanket write tokens.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    uses: resq-software/.github/.github/workflows/required.yml@f4b51a620aa1bf89c0bce4f434b36f92ff7d517d
    with:
      lang: dotnet
      dotnet-solution: ResQ.BuildingBlocks.slnx
      # `codeql-languages` is deliberately omitted. It defaults to "[]",
      # which skips security-scan's CodeQL job.
      #
      # Code-scanning *default setup* is enabled on this repository, so every
      # advanced-setup upload is rejected: the analyze step logs "Analysis
      # upload status is failed. CodeQL analyses from advanced configurations
      # cannot be processed when the default setup is enabled" and ends with
      # "CodeQL job status was configuration error". The reusable carries
      # `continue-on-error: true` on that step, and the `##[error]` is emitted
      # by the Analyze step itself, in its main phase, which is exactly what
      # that flag swallows. (Only the trailing "CodeQL job status was ..." line
      # is printed after the step, by init-post; a passing run prints it too,
      # reading "was success".) So the job still reported success — a
      # configuration error that had become a permanent green check.
      #
      # Unlike the sibling .NET repositories this one has no security.yml, so
      # this line was the repository's only advanced-CodeQL declaration rather
      # than a duplicate. Dropping it therefore changes the fallback posture:
      # if default setup were ever turned off here, no CodeQL would run at all
      # until it is re-enabled or this input is restored. That is the accepted
      # trade — default setup is the chosen configuration, and it runs the
      # broader `extended` query suite that this job never could.

  # Repo-specific: verify all eight building-block packages + the template
  # pack cleanly, and publish the artifacts for inspection.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs full history + tags for versioning
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet pack ResQ.BuildingBlocks.slnx -c Release -o artifacts
      - name: Pack the dotnet-new template package
        run: dotnet pack templates/ResQ.BuildingBlocks.Templates.csproj -c Release -o artifacts
      - name: Validate packages (metadata, SourceLink, deterministic build)
        # dotnet-validate takes one .nupkg at a time, so loop; the default bash -eo pipefail
        # aborts the step on the first failure. Determinism passes because this job runs with
        # CI=true, which turns on ContinuousIntegrationBuild via Directory.Build.props.
        run: |
          dotnet tool restore
          for pkg in artifacts/*.nupkg; do
            echo "::group::validate $pkg"
            dotnet validate package local "$pkg"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: artifacts/*.nupkg

  # Repo-specific: generate a service from the template and build/test it
  # against the locally-packed building blocks on a temp NuGet source.
  template-smoke:
    name: Template Smoke (dotnet new)
    runs-on: ubuntu-latest
    env:
      # Deterministic version shared by the locally-packed building blocks and
      # the generated service, so it restores them off the temp NuGet source.
      PKG_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack building blocks to a local feed
        # MinVer derives Version from git height and overrides -p:Version;
        # MinVerVersionOverride is its escape hatch, so the feed is exactly
        # $PKG_VERSION (matching the version the generated service is repinned to).
        run: dotnet pack -c Release -o "$RUNNER_TEMP/local-nuget" -p:MinVerVersionOverride="$PKG_VERSION"
      - name: Pack the template package
        run: dotnet pack templates/ResQ.BuildingBlocks.Templates.csproj -c Release -o "$RUNNER_TEMP/template-pkg" -p:MinVerVersionOverride="$PKG_VERSION"
      - name: Install template
        run: dotnet new install "$RUNNER_TEMP"/template-pkg/ResQ.BuildingBlocks.Templates.*.nupkg
      - name: Generate a service from the template
        run: dotnet new resq-service -n Smoke -o "$RUNNER_TEMP/Smoke"
      - name: Build & test the generated service
        working-directory: ${{ runner.temp }}/Smoke
        run: |
          [ -f nuget.config ] || dotnet new nugetconfig
          dotnet nuget add source "$RUNNER_TEMP/local-nuget" --name local-buildingblocks --configfile nuget.config
          # Repoint the template's ResQ.BuildingBlocks.* pins at the locally-packed
          # CI version so restore resolves off the temp feed (that version is not on
          # nuget.org, so there is no ambiguity with the published packages).
          sed -i -E "s|(Include=\"ResQ\.BuildingBlocks\.[A-Za-z.]+\" Version=)\"[^\"]*\"|\1\"$PKG_VERSION\"|g" Directory.Packages.props
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --filter "Category!=Integration"

  # Single status-check context the org ruleset requires. Also gates the
  # repo-specific pack + template smoke so a failure in either blocks merge.
  required:
    name: required
    runs-on: ubuntu-latest
    needs: [gates, pack, template-smoke]
    if: always()
    steps:
      - name: Evaluate upstream results
        env:
          GATES: ${{ needs.gates.result }}
          PACK: ${{ needs.pack.result }}
          TEMPLATE: ${{ needs.template-smoke.result }}
        run: |
          set -eu
          fail=0
          for kv in "gates=$GATES" "pack=$PACK" "template-smoke=$TEMPLATE"; do
            name=${kv%%=*}
            res=${kv#*=}
            case "$res" in
              success | skipped | "") echo "ok: $name=$res" ;;
              *)
                echo "::error::$name returned: $res"
                fail=1
                ;;
            esac
          done
          [ "$fail" = 0 ] || exit 1

  publish:
    name: Publish to NuGet
    needs: [required]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      # OIDC token for NuGet trusted publishing (no long-lived API key), and to
      # sign the build-provenance attestation through Sigstore.
      id-token: write
      attestations: write # store the provenance attestation against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack
        # On a v* tag MinVer derives the version from the tag. On a manual dispatch
        # (fallback when tag creation is restricted) pack the explicit publish_version.
        env:
          VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_version || '' }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            dotnet pack -c Release -o artifacts -p:MinVerVersionOverride="$VERSION_OVERRIDE"
            # The template package doesn't use MinVer (it's a content-only package outside src/),
            # so set its version directly with -p:Version to track the release being published.
            dotnet pack templates/ResQ.BuildingBlocks.Templates.csproj -c Release -o artifacts -p:Version="$VERSION_OVERRIDE"
          else
            dotnet pack -c Release -o artifacts
            dotnet pack templates/ResQ.BuildingBlocks.Templates.csproj -c Release -o artifacts
          fi
      # SPDX JSON SBOM of what the packages ship: src/ after pack, where each
      # library's .deps.json lists the dependencies it was built against. The
      # release job attaches it to the GitHub Release.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: src
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
      # Provenance for exactly what is pushed below, attested before it is
      # public. Verify a package with
      #   gh attestation verify <file>.nupkg --repo resq-software/dotnet
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
      # Exchange the GitHub OIDC token for a short-lived NuGet API key via trusted
      # publishing. Requires a matching policy on nuget.org (repo resq-software/dotnet,
      # workflow ci.yml, environment nuget) and the NUGET_USER repo variable.
      - name: Authenticate to NuGet via OIDC trusted publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        # Pass the short-lived key via env, never interpolated directly into the
        # run script (avoids zizmor template-injection; the shell reads $NUGET_API_KEY).
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Publish a GitHub Release per v* tag so the org's changelog
  # aggregator picks the version up — the aggregator ingests GitHub *Releases*,
  # not git tags or NuGet versions. Runs only after a successful NuGet publish,
  # and only on a tag (a manual workflow_dispatch has no tag to release against).
  release:
    name: GitHub Release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the SBOM
    steps:
      # The SBOM the publish job generated for the packages it pushed. Fetched
      # first, so a failure here happens before the Release is public.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Create GitHub Release from the tag
        # `gh` reads $GH_TOKEN and $GITHUB_REPOSITORY automatically; the tag is
        # passed via env (never `${{ }}` inside run:) to avoid zizmor template
        # injection. --generate-notes builds notes from merged PRs since the
        # previous tag; --verify-tag asserts the ref is a real tag first.
        # Skipped when the Release already exists, so a re-run after a failed
        # upload below can finish the job instead of failing here.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; attaching the SBOM only"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
      - name: Attach the SBOM to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # --clobber keeps a re-run idempotent.
        run: gh release upload "$TAG" sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
