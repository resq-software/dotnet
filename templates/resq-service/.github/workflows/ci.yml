name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  Configuration: Release

jobs:
  build:
    name: Build · Unit + Architecture · Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests need Docker; the default run filters them out.
      - run: dotnet test --no-build -c Release --filter Category!=Integration --verbosity normal
      - run: dotnet pack --no-build -c Release -o artifacts

  integration:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Testcontainers spins up PostgreSQL; the ubuntu-latest runner ships a working Docker daemon.
      - run: dotnet test --no-build -c Release --filter Category=Integration --verbosity normal
